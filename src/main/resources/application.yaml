spring:
  application:
    name: orderflow
  banner:
    location: classpath:banner.txt

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  success-url: http://localhost:8080/success
  cancel-url: http://localhost:8080/cancel